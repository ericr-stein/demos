name: demos
services:
  demos:
    build: .
    image: demos:latest
    container_name: demos
    labels:
      com.box.project: demos
      com.box.service: web
      com.box.tier: frontend
      com.box.managed-by: agent
    # stub_status on :8080 (not proxied by Caddy or the tunnel, which both
    # target :80) for the nginx-exporter sidecar below.
    configs:
      - source: nginx_stub_status
        target: /etc/nginx/conf.d/stub_status.conf
    networks: [edge]
    restart: unless-stopped
  # Prometheus exporter for the demos nginx (stub_status -> nginx_* on :9113,
  # no auth). Scraped by prometheus over `edge`, where it reaches demos.
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.5.3
    container_name: demos-nginx-exporter
    command: ["--nginx.scrape-uri=http://demos:8080/stub_status"]
    depends_on: [demos]
    labels:
      com.box.project: demos
      com.box.service: nginx-exporter
      com.box.tier: agent
      com.box.managed-by: agent
    networks: [edge]
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: demos-api:latest
    container_name: demos-api
    environment:
      # injected from Infisical /demos by the systemd unit
      - DEMOS_DB_PASSWORD=${DEMOS_DB_PASSWORD:?inject_via_infisical}
    labels:
      com.box.project: demos
      com.box.service: api
      com.box.tier: backend
      com.box.managed-by: agent
    networks: [edge, internal]
    restart: unless-stopped
  # Public ingress: outbound-only Cloudflare Tunnel (no inbound ports on the
  # VM). Routes demos.nonsh.dev from the internet to demos/demos-api directly,
  # bypassing Caddy/Authelia — the tailnet route through Caddy stays gated.
  cloudflared:
    image: cloudflare/cloudflared:2026.10.0
    container_name: demos-cloudflared
    # Pin the native Prometheus endpoint (otherwise the first free port of
    # 20241-20245). Not published: scraped by prometheus over `edge` only.
    command: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:20241", "run"]
    environment:
      - TUNNEL_TOKEN=${CF_TUNNEL_TOKEN:?inject_via_infisical}
    labels:
      com.box.project: demos
      com.box.service: cloudflared
      com.box.tier: agent
      com.box.managed-by: agent
    networks: [edge]
    restart: unless-stopped
configs:
  nginx_stub_status:
    content: |
      server {
          listen 8080;
          server_name _;
          access_log off;
          location = /stub_status {
              stub_status;
          }
      }
networks:
  edge: { external: true }
  internal: { external: true }
